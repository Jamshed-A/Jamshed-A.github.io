<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator — Live Demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:#0f1f18; color:#eaf5ee}
  .calc{width:100%; max-width:400px; background:#16281f; border:1px solid #2a4234; border-radius:18px; padding:26px; box-shadow:0 24px 50px rgba(0,0,0,.4)}
  h1{font-size:1.25rem; margin:0 0 4px}
  .sub{color:#9db8a7; font-size:.88rem; margin:0 0 20px}
  label{display:block; font-size:.82rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#9db8a7; margin:14px 0 6px}
  input[type=number]{width:100%; padding:13px 14px; font-size:1.15rem; border-radius:10px; border:1px solid #2a4234; background:#0c1712; color:#eaf5ee; outline:none}
  input[type=number]:focus{border-color:#4cc38a}
  .ops{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .op{padding:12px; border-radius:10px; border:1px solid #2a4234; background:#0c1712; color:#eaf5ee; font-weight:700; font-size:1rem; cursor:pointer; min-height:48px}
  .op[aria-pressed="true"]{background:#0e4d3a; border-color:#4cc38a; color:#fff}
  .go{width:100%; margin-top:20px; padding:14px; border:0; border-radius:10px; background:#4cc38a; color:#08130d; font-weight:800; font-size:1.05rem; cursor:pointer; min-height:52px}
  .go:hover{filter:brightness(1.07)}
  .result{margin-top:20px; background:#0c1712; border:1px dashed #2a4234; border-radius:10px; padding:16px; text-align:center; min-height:74px}
  .result small{display:block; color:#9db8a7; font-weight:700; font-size:.78rem; letter-spacing:.05em; text-transform:uppercase}
  .result b{font-size:1.9rem; line-height:1.2; word-break:break-all}
  .note{margin-top:16px; color:#7d9687; font-size:.8rem; text-align:center}
</style>
</head>
<body>
  <main class="calc">
    <h1>Simple Calculator</h1>
    <p class="sub">The original project asks for two numbers and one operator — this is that same logic, running in your browser.</p>

    <label for="firstNumber">Enter first number</label>
    <input type="number" id="firstNumber" inputmode="decimal" placeholder="e.g. 12">

    <label for="secondNumber">Enter second number</label>
    <input type="number" id="secondNumber" inputmode="decimal" placeholder="e.g. 4">

    <label>Select one of the operators to perform operation</label>
    <div class="ops" role="group" aria-label="Operator">
      <button type="button" class="op" data-op="Addition" aria-pressed="true">+ Addition</button>
      <button type="button" class="op" data-op="Subtraction" aria-pressed="false">− Subtraction</button>
      <button type="button" class="op" data-op="Multiplication" aria-pressed="false">× Multiplication</button>
      <button type="button" class="op" data-op="Division" aria-pressed="false">÷ Division</button>
    </div>

    <button type="button" class="go" id="calculate">Calculate</button>

    <div class="result" aria-live="polite">
      <small>Result</small>
      <b id="output">—</b>
    </div>

    <p class="note">Web version of the Simple-Calculator CLI project by Jamshaid Ali.</p>
  </main>

<script>
  // Same conditional logic as the original index.js / index.ts:
  // Addition, Subtraction, Multiplication, Division on two numbers.
  var operator = "Addition";
  var ops = document.querySelectorAll('.op');
  ops.forEach(function(btn){
    btn.addEventListener('click', function(){
      operator = btn.getAttribute('data-op');
      ops.forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
    });
  });

  document.getElementById('calculate').addEventListener('click', function(){
    var firstNumber = parseFloat(document.getElementById('firstNumber').value);
    var secondNumber = parseFloat(document.getElementById('secondNumber').value);
    var out = document.getElementById('output');

    if (isNaN(firstNumber) || isNaN(secondNumber)) {
      out.textContent = 'Enter both numbers';
      return;
    }
    var result;
    if (operator === "Addition") {
      result = firstNumber + secondNumber;
    } else if (operator === "Subtraction") {
      result = firstNumber - secondNumber;
    } else if (operator === "Multiplication") {
      result = firstNumber * secondNumber;
    } else if (operator === "Division") {
      result = firstNumber / secondNumber;
    } else {
      out.textContent = 'Please select valid operator';
      return;
    }
    out.textContent = String(Math.round(result * 1e10) / 1e10);
  });
</script>
</body>
</html>
