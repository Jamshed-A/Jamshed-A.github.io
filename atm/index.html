<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM — Live Demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:#101418; color:#e8eef4}
  .atm{width:100%; max-width:400px; background:#1a2129; border:1px solid #2e3947; border-radius:18px; padding:26px; box-shadow:0 24px 50px rgba(0,0,0,.45)}
  h1{font-size:1.25rem; margin:0 0 4px}
  .sub{color:#93a5b8; font-size:.88rem; margin:0 0 18px}
  .screen{background:#0a2e22; border:1px solid #17503c; border-radius:12px; padding:16px; min-height:120px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.95rem; line-height:1.55; color:#b9f4d8; white-space:pre-wrap; word-break:break-word}
  label{display:block; font-size:.82rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#93a5b8; margin:16px 0 6px}
  input[type=password], input[type=number]{width:100%; padding:13px 14px; font-size:1.15rem; border-radius:10px; border:1px solid #2e3947; background:#0d1116; color:#e8eef4; outline:none}
  input:focus{border-color:#4cc38a}
  .btn{width:100%; padding:13px; border:0; border-radius:10px; background:#4cc38a; color:#08130d; font-weight:800; font-size:1rem; cursor:pointer; min-height:50px; margin-top:14px}
  .btn:hover{filter:brightness(1.07)}
  .btn.secondary{background:#232d38; color:#e8eef4; border:1px solid #2e3947}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .hidden{display:none}
  .note{margin-top:16px; color:#71859a; font-size:.8rem; text-align:center}
</style>
</head>
<body>
  <main class="atm">
    <h1>ATM Machine</h1>
    <p class="sub">The original CLI project, running in your browser — same PIN, same starting balance, same options.</p>

    <div class="screen" id="screen" aria-live="polite">Welcome! Please enter your PIN to continue.</div>

    <!-- PIN step -->
    <div id="pinStep">
      <label for="pin">Enter your pin</label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••">
      <button type="button" class="btn" id="pinBtn">Enter PIN</button>
      <p class="note">Demo PIN from the original code: <b>1234</b> · Starting balance: <b>$10,000</b></p>
    </div>

    <!-- Menu step -->
    <div id="menuStep" class="hidden">
      <label>Please select option</label>
      <div class="row">
        <button type="button" class="btn" id="withdrawBtn" style="margin-top:0">Withdraw</button>
        <button type="button" class="btn secondary" id="balanceBtn" style="margin-top:0">Check balance</button>
      </div>
      <div id="amountBox" class="hidden">
        <label for="amount">Enter your amount</label>
        <input type="number" id="amount" inputmode="numeric" min="1" placeholder="e.g. 500">
        <button type="button" class="btn" id="confirmWithdraw">Confirm Withdraw</button>
      </div>
      <button type="button" class="btn secondary" id="exitBtn">Exit / Restart</button>
    </div>

    <p class="note">Web version of the ATM CLI project by Jamshaid Ali.</p>
  </main>

<script>
  // Same logic as the original main.js / main.ts:
  // myBalance = 10000 (Dollar), myPin = 1234,
  // options: "withdraw" and "check balance".
  var myBalance = 10000;
  var myPin = 1234;

  var screen = document.getElementById('screen');
  var pinStep = document.getElementById('pinStep');
  var menuStep = document.getElementById('menuStep');
  var amountBox = document.getElementById('amountBox');

  function say(msg){ screen.textContent = msg; }

  document.getElementById('pinBtn').addEventListener('click', function(){
    var pin = parseInt(document.getElementById('pin').value, 10);
    if (pin === myPin) {
      say('Correct pin!!!\nPlease select an option: withdraw or check balance.');
      pinStep.classList.add('hidden');
      menuStep.classList.remove('hidden');
    } else {
      say('Incorrect pin number. Please try again.');
    }
  });

  document.getElementById('balanceBtn').addEventListener('click', function(){
    amountBox.classList.add('hidden');
    say('Your remaining balance is: ' + myBalance);
  });

  document.getElementById('withdrawBtn').addEventListener('click', function(){
    amountBox.classList.remove('hidden');
    document.getElementById('amount').focus();
    say('Enter the amount you want to withdraw.');
  });

  document.getElementById('confirmWithdraw').addEventListener('click', function(){
    var amount = parseFloat(document.getElementById('amount').value);
    if (isNaN(amount) || amount <= 0) {
      say('Please enter a valid amount.');
      return;
    }
    if (amount > myBalance) {
      say('Insufficient balance.\nYour remaining balance is: ' + myBalance);
    } else {
      myBalance -= amount;
      say('Withdrawal successful: $' + amount + '\nYour remaining balance is: ' + myBalance);
    }
    amountBox.classList.add('hidden');
    document.getElementById('amount').value = '';
  });

  document.getElementById('exitBtn').addEventListener('click', function(){
    myBalance = 10000;
    document.getElementById('pin').value = '';
    menuStep.classList.add('hidden');
    amountBox.classList.add('hidden');
    pinStep.classList.remove('hidden');
    say('Welcome! Please enter your PIN to continue.');
  });
</script>
</body>
</html>
